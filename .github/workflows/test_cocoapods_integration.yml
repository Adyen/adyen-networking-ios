name: Test Cocoapods Integration

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]

  push:
    branches:
    - main
    - develop

jobs:

  pods:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - uses: n1hility/cancel-previous-runs@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Select latest Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.1'

    - name: Install Prerequisites
      run: |
        gem install cocoapods -v 1.10.2
        pod repo update

        # brew cannot install older versions and in xcodegen 2.44 there is a bug that doesn't work well with cocoapods
        # so we install mint so we can install an older version of xcodegen
        brew update
        brew install mint
        mint install yonaskolb/xcodegen@2.43.0
        export PATH="$PATH:/Users/runner/.mint/bin"
        
    - name: Lint Cocoapods
      run: |
        pod lib lint AdyenNetworking.podspec --allow-warnings --verbose
    
    - name: Test Cocoapods Integration
      run: |
        Scripts/test-CocoaPods-integration.sh
