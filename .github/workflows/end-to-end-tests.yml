name: End to End Tests

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]

  push:
    branches:
    - main
    - develop

jobs:

  tests:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    - uses: n1hility/cancel-previous-runs@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Select latest Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.1'

    - name: 🧪 Run End to End Tests
      run: |
        xcodebuild test \
          -project "AdyenNetworking.xcodeproj" \
          -scheme "EndToEndTests" \
          -testPlan "EndToEndTests" \
          -enableCodeCoverage YES \
          -resultBundlePath "EndToEndTests.xcresult" \
          -destination "name=iPhone 16 Pro,OS=18.1" \
          GO_REST_AUTH_BEARER='Bearer e475ecaf522c28108af6b7a99e0ad788c73e9f8b15608ee3a1acef57da1c36f6' \
          | xcpretty --utf --color && exit ${PIPESTATUS[0]}
