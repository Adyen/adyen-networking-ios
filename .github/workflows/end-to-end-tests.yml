name: End to End Tests

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]

  push:
    branches:
    - main
    - develop

jobs:

  tests:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v7
    - uses: n1hility/cancel-previous-runs@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Select latest Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: 🧪 Run End to End Tests
      run: |
        xcodebuild test \
          -project "AdyenNetworking.xcodeproj" \
          -scheme "EndToEndTests" \
          -testPlan "EndToEndTests" \
          -enableCodeCoverage YES \
          -resultBundlePath "EndToEndTests.xcresult" \
          -destination "name=iPhone Air,OS=26.5" \
          GO_REST_AUTH_BEARER='Bearer $GO_REST_AUTH_BEARER' \
          | xcpretty --utf --color && exit ${PIPESTATUS[0]}
      env:
        GO_REST_AUTH_BEARER: ${{ secrets.GO_REST_AUTH_BEARER }}
